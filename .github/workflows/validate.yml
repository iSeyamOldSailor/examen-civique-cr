name: Validate civic exam PWA
on:
  push:
    branches: [main]
    paths: ['index.html', '*.js', '*.webmanifest', '*.png', '.github/qa/**', '.github/workflows/validate.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: civic-pwa-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    name: Browser tests (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.58.0-noble
      options: --ipc=host
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install browser test tools
        run: |
          python -m venv "$RUNNER_TEMP/civic-qa"
          "$RUNNER_TEMP/civic-qa/bin/pip" install --disable-pip-version-check 'playwright==1.58.0'
      - name: Test the release in an isolated profile
        run: '"$RUNNER_TEMP/civic-qa/bin/python" .github/qa/validate.py ${{ matrix.engine }}'
